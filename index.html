<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<meta name="description" content="Personal portfolio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf9; --surface: #ffffff; --text: #1c1917; --muted: #57534e;
    --line: #e7e5e4; --accent: #4f46e5; --accent-soft: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0a09; --surface: #1c1917; --text: #f5f5f4; --muted: #a8a29e;
      --line: #292524; --accent: #818cf8; --accent-soft: #1e1b4b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c0a09; --surface: #1c1917; --text: #f5f5f4; --muted: #a8a29e;
    --line: #292524; --accent: #818cf8; --accent-soft: #1e1b4b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; transition: background .2s, color .2s; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }
  h1, h2, h3 { font-family: "Space Grotesk", Inter, sans-serif; line-height: 1.15; }

  nav { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; }
  .logo { font-family: "Space Grotesk"; font-weight: 700; font-size: 1.15rem; }
  .links { display: flex; gap: 22px; align-items: center; font-size: .92rem; color: var(--muted); }
  .links a:hover { color: var(--text); }
  .theme-btn { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 1rem; }
  @media (max-width: 640px) { .links a { display: none; } }

  .hero { padding: 96px 0 72px; }
  .avatar { width: 88px; height: 88px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #ec4899); display: grid; place-items: center; color: #fff; font-family: "Space Grotesk"; font-size: 2rem; font-weight: 700; margin-bottom: 28px; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .eyebrow { color: var(--accent); font-weight: 600; font-size: .9rem; letter-spacing: .04em; text-transform: uppercase; }
  .hero h1 { font-size: clamp(2.4rem, 7vw, 4rem); margin: 10px 0 18px; }
  .hero p { font-size: 1.15rem; color: var(--muted); max-width: 620px; }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
  .btn { padding: 11px 20px; border-radius: 10px; font-weight: 600; font-size: .95rem; border: 1px solid var(--line); background: var(--surface); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:hover { transform: translateY(-1px); }

  section { padding: 64px 0; border-top: 1px solid var(--line); }
  section h2 { font-size: 1.8rem; margin-bottom: 28px; }
  .about { display: grid; grid-template-columns: 2fr 1fr; gap: 40px; }
  .about p { color: var(--muted); margin-bottom: 14px; }
  .facts { list-style: none; display: grid; gap: 12px; }
  .facts li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; font-size: .92rem; }
  .facts span { display: block; color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; }
  @media (max-width: 720px) { .about { grid-template-columns: 1fr; } }

  .timeline { display: grid; gap: 18px; }
  .item { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
  .item-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .item h3 { font-size: 1.1rem; }
  .item .where { color: var(--accent); font-weight: 500; font-size: .95rem; }
  .item .when { color: var(--muted); font-size: .88rem; white-space: nowrap; }
  .item p { color: var(--muted); margin-top: 10px; font-size: .95rem; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 10px; transition: border-color .2s, transform .2s; }
  .card:hover { border-color: var(--accent); transform: translateY(-3px); }
  .card p { color: var(--muted); font-size: .93rem; flex: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { background: var(--accent-soft); color: var(--accent); font-size: .78rem; font-weight: 500; padding: 4px 10px; border-radius: 999px; }
  .card .more { font-size: .9rem; font-weight: 600; color: var(--accent); }

  .skills { display: flex; flex-wrap: wrap; gap: 10px; }
  .skills .tag { font-size: .9rem; padding: 8px 14px; }

  .contact { text-align: center; }
  .contact p { color: var(--muted); max-width: 520px; margin: 0 auto 26px; }
  .contact .cta { justify-content: center; }
  footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 32px 0 48px; }
</style>
</head>
<body>
<script>
/* ============================================================
   EDIT YOUR DETAILS HERE — everything on the page comes from this.
   ============================================================ */
const PROFILE = {
  name: "Raikul Islam",
  role: "CS Student",
  tagline: "Second-year Computer Science student at Canterbury Christ Church University. Focused, reliable and always keen to learn and build new things.",
  photo: "", // e.g. "me.jpg" — leave empty to show your initials
  location: "Canterbury, UK",
  email: "islamrafi1180@gmail.com",
  links: { github: "", linkedin: "", resume: "" },

  about: [
    "I'm Raikul, a full-time BSc Computer Science student in my second year at Canterbury Christ Church University (CCCU). I'm strongly focused on my studies and enjoy turning what I learn in lectures into real, working projects.",
    "People I work with describe me as reliable and hard-working. I balance my degree with a part-time job, which has taught me good time management, teamwork and how to stay calm under pressure."
  ],

  education: [
    { school: "Canterbury Christ Church University", degree: "BSc (Hons) Computer Science, full-time", when: "2025 – Present",
      details: "Currently in my second year of undergraduate study, covering programming, software development, databases and web technologies." }
  ],

  experience: [
    { title: "Food Delivery Driver", org: "Part-time", when: "Ongoing",
      details: "Delivering orders quickly and safely while managing my own schedule, routes and time alongside full-time study." },
    { title: "Staff Member", org: "Golf Club · Part-time", when: "Ongoing",
      details: "Working with members and guests, providing friendly customer service and working as part of a team." }
  ],

  projects: [
    { name: "Indigo Ludo Game", desc: "A full Ludo game app built as a first-year university group assignment. I worked in a team of five to plan, build and test a complete, playable version of the classic board game.", tags: ["Game app", "Team of 5", "University module"], link: "" }
  ],

  skills: ["Python", "Java", "C#", "HTML", "CSS", "Problem solving", "Teamwork", "Communication", "Time management", "Customer service"]
};
</script>

<nav>
  <div class="wrap">
    <a href="#top" class="logo" id="logo"></a>
    <div class="links">
      <a href="#about">About</a><a href="#education">Education</a><a href="#projects">Projects</a><a href="#contact">Contact</a>
      <button class="theme-btn" id="theme" aria-label="Toggle theme">◐</button>
    </div>
  </div>
</nav>

<main id="top">
  <header class="hero wrap">
    <div class="avatar" id="avatar"></div>
    <div class="eyebrow" id="role"></div>
    <h1 id="hello"></h1>
    <p id="tagline"></p>
    <div class="cta" id="hero-cta"></div>
  </header>

  <section id="about"><div class="wrap">
    <h2>About me</h2>
    <div class="about"><div id="about-text"></div><ul class="facts" id="facts"></ul></div>
  </div></section>

  <section id="education"><div class="wrap">
    <h2>Education</h2><div class="timeline" id="edu"></div>
  </div></section>

  <section id="experience"><div class="wrap">
    <h2>Experience</h2><div class="timeline" id="exp"></div>
  </div></section>

  <section id="projects"><div class="wrap">
    <h2>Projects</h2><div class="grid" id="proj"></div>
  </div></section>

  <section id="skills"><div class="wrap">
    <h2>Skills</h2><div class="skills" id="skill-list"></div>
  </div></section>

  <section id="contact" class="contact"><div class="wrap">
    <h2>Let's connect</h2>
    <p>I'm open to internships, collaborations and new opportunities. Feel free to reach out.</p>
    <div class="cta" id="contact-cta"></div>
  </div></section>
</main>
<footer id="footer"></footer>

<script>
  const P = PROFILE, $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  const initials = P.name.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();

  document.title = `${P.name} — Portfolio`;
  $("logo").textContent = initials;
  $("avatar").innerHTML = P.photo ? `<img src="${esc(P.photo)}" alt="${esc(P.name)}">` : initials;
  $("role").textContent = P.role;
  $("hello").textContent = `Hi, I'm ${P.name}.`;
  $("tagline").textContent = P.tagline;

  const buttons = [
    `<a class="btn primary" href="mailto:${esc(P.email)}">Email me</a>`,
    P.links.github && `<a class="btn" href="${esc(P.links.github)}" target="_blank" rel="noopener">GitHub</a>`,
    P.links.linkedin && `<a class="btn" href="${esc(P.links.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>`,
    P.links.resume && `<a class="btn" href="${esc(P.links.resume)}" target="_blank" rel="noopener">Résumé</a>`
  ].filter(Boolean).join("");
  $("hero-cta").innerHTML = buttons;
  $("contact-cta").innerHTML = buttons;

  $("about-text").innerHTML = P.about.map(p => `<p>${esc(p)}</p>`).join("");
  const uni = P.education[0];
  $("facts").innerHTML = [
    ["Based in", P.location],
    uni && ["Studying", `${uni.degree}, ${uni.school}`],
    ["Email", P.email]
  ].filter(Boolean).map(([k, v]) => `<li><span>${k}</span>${esc(v)}</li>`).join("");

  const item = (title, where, when, details) => `
    <div class="item"><div class="item-head"><div><h3>${esc(title)}</h3><div class="where">${esc(where)}</div></div>
    <div class="when">${esc(when)}</div></div>${details ? `<p>${esc(details)}</p>` : ""}</div>`;
  $("edu").innerHTML = P.education.map(e => item(e.school, e.degree, e.when, e.details)).join("");
  if (P.experience.length) $("exp").innerHTML = P.experience.map(e => item(e.title, e.org, e.when, e.details)).join("");
  else $("experience").remove();

  $("proj").innerHTML = P.projects.map(p => `
    <div class="card"><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p>
    <div class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
    ${p.link ? `<a class="more" href="${esc(p.link)}" target="_blank" rel="noopener">View project →</a>` : ""}</div>`).join("");

  $("skill-list").innerHTML = P.skills.map(s => `<span class="tag">${esc(s)}</span>`).join("");
  $("footer").textContent = `© ${new Date().getFullYear()} ${P.name}`;

  // Light/dark toggle
  const root = document.documentElement;
  try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch (e) {}
  $("theme").onclick = () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
  };
</script>
</body>
</html>
